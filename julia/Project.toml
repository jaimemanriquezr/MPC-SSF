name = "MPCSSF"
uuid = "72a1329e-ec7d-4c0b-a0f5-c46aac3128f3"
authors = ["Jamie <jr.manriquezr@gmail.com>"]
version = "0.1.0"

# Julia port of the MATLAB multiphase continuum model of slow sand filtration
# (Diehl et al.). Phase 1 targets parity with the current MATLAB `src/`
# (fixed-step biofilm model). See ../.claude/julia-port-outline.md and ../TODO.md.

[deps]
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"

# Plotting is a package extension: the core stays dependency-free, and the plot
# methods load when a Makie backend (CairoMakie/GLMakie) is imported.
[weakdeps]
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"

[extensions]
MPCSSFMakieExt = "Makie"

[compat]
Makie = "0.20, 0.21, 0.22, 0.23, 0.24"
julia = "1.10"

[extras]
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "DelimitedFiles", "Printf"]
